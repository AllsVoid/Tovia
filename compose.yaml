name: tovia
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tovia}
      POSTGRES_USER: ${POSTGRES_USER:-tovia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tovia_local_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tovia}:${POSTGRES_PASSWORD:-tovia_local_only}@db:5432/${POSTGRES_DB:-tovia}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tovia}:${POSTGRES_PASSWORD:-tovia_local_only}@db:5432/${POSTGRES_DB:-tovia}
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-development}
      DEV_USER_ID: ${DEV_USER_ID:-00000000-0000-4000-8000-000000000001}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WEB_AUTH_MODE: ${NEXT_PUBLIC_WEB_AUTH_MODE:-development}
    environment:
      NEXT_PUBLIC_WEB_AUTH_MODE: ${NEXT_PUBLIC_WEB_AUTH_MODE:-development}
      TOVIA_API_URL: ${TOVIA_API_URL:-http://api:8000}
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-}
      LOGTO_APP_ID: ${LOGTO_APP_ID:-}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:-}
      LOGTO_BASE_URL: ${LOGTO_BASE_URL:-}
      LOGTO_COOKIE_SECRET: ${LOGTO_COOKIE_SECRET:-}
      LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:

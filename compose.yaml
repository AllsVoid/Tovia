name: tovia
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tovia}
      POSTGRES_USER: ${POSTGRES_USER:-tovia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tovia_local_only}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tovia}:${POSTGRES_PASSWORD:-tovia_local_only}@db:5432/${POSTGRES_DB:-tovia}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tovia}:${POSTGRES_PASSWORD:-tovia_local_only}@db:5432/${POSTGRES_DB:-tovia}
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-development}
      DEV_USER_ID: ${DEV_USER_ID:-00000000-0000-4000-8000-000000000001}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-30}
      LOGTO_MANAGEMENT_TOKEN_ENDPOINT: ${LOGTO_MANAGEMENT_TOKEN_ENDPOINT:-}
      LOGTO_MANAGEMENT_API_URL: ${LOGTO_MANAGEMENT_API_URL:-}
      LOGTO_MANAGEMENT_API_RESOURCE: ${LOGTO_MANAGEMENT_API_RESOURCE:-}
      LOGTO_MANAGEMENT_CLIENT_ID: ${LOGTO_MANAGEMENT_CLIENT_ID:-}
      LOGTO_MANAGEMENT_CLIENT_SECRET: ${LOGTO_MANAGEMENT_CLIENT_SECRET:-}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-${NEXT_PUBLIC_API_URL:-http://localhost:8000}}
        NEXT_PUBLIC_WEB_AUTH_MODE: ${NEXT_PUBLIC_WEB_AUTH_MODE:-development}
    environment:
      APP_ENV: ${APP_ENV:-development}
      NEXT_PUBLIC_WEB_AUTH_MODE: ${NEXT_PUBLIC_WEB_AUTH_MODE:-development}
      TOVIA_API_URL: ${TOVIA_API_URL:-http://api:8000}
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-}
      LOGTO_APP_ID: ${LOGTO_APP_ID:-}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:-}
      LOGTO_BASE_URL: ${LOGTO_BASE_URL:-${WEB_PUBLIC_URL:-http://localhost:3000}}
      LOGTO_COOKIE_SECRET: ${LOGTO_COOKIE_SECRET:-}
      LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE:-}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
